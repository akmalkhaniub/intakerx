services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: intakerx
      POSTGRES_PASSWORD: password
      POSTGRES_DB: intakerx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intakerx"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DATABASE_URL=postgresql://intakerx:password@postgres:5432/intakerx?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
